name: CI/CD

on:
  pull_request:
  push: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Compiler et tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compiler et exécuter les tests
        run: chmod +x mvnw && ./mvnw --batch-mode clean verify

  docker:
    name: Construire et publier Docker
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire l'image Docker
        run: docker build --tag ghcr.io/${{ github.repository }}:latest .
      - name: Publier l'image Docker
        run: docker push ghcr.io/${{ github.repository }}:latest
