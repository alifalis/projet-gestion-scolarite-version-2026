
name: CI/CD

on:
  pull_request:
  push:
    branches:
      - springbatch

permissions:
  contents: read
  packages: write

jobs:
  # 1. Compilation et tests
  test:
    name: Compiler et tester
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler et exécuter les tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

  # 2. Construire et publier Docker
  docker:
    name: Construire et publier Docker
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image Docker
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker build -t "$IMAGE" .

      - name: Publier l'image Docker
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker push "$IMAGE"

  # 3. Déploiement sur Oracle Cloud
  deploy:
    name: Déployer sur Oracle Cloud
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest

    concurrency:
      group: oracle-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/oracle_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/known_hosts

      - name: Transférer les fichiers
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          # Créer le dossier de déploiement
          ssh -i ~/.ssh/oracle_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$HOST" \
            "mkdir -p ~/gestionScolarite_JEE/src/main/resources/db"

          # Transférer Docker Compose
          scp -i ~/.ssh/oracle_deploy \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            ubuntu@"$HOST":gestionScolarite_JEE/docker-compose.yml

          # Transférer le schéma SQL
          scp -i ~/.ssh/oracle_deploy \
            -o StrictHostKeyChecking=yes \
            src/main/resources/db/schema.sql \
            ubuntu@"$HOST":gestionScolarite_JEE/src/main/resources/db/schema.sql

          # Transférer la configuration HTTPS
          scp -i ~/.ssh/oracle_deploy \
            -o StrictHostKeyChecking=yes \
            Caddyfile \
            ubuntu@"$HOST":gestionScolarite_JEE/Caddyfile

      - name: Déployer avec Docker Compose
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          ssh -i ~/.ssh/oracle_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$HOST" \
            'cd ~/gestionScolarite_JEE &&
             sudo docker compose config --quiet &&
             sudo docker compose pull &&
             sudo docker compose up -d &&
             sudo docker compose ps'
